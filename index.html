<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SouthBag Branch Locator</title>
        <meta name="description" content="Find your nearest SouthBag branch." />
        <link
            rel="icon"
            href="https://south.slitro.studio/logo.png"
            type="image/png"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
        />
    </head>
    <body>
        <header class="site-header">
            <img
                class="site-logo"
                src="https://south.slitro.studio/logo.png"
                alt="SouthBag Branch Locator Logo"
            />
            <h2>Southbag Online Banking</h2>
        </header>

        <main>
            <h1>southbag branch locator</h1>
            <p>Please allow location access to find your nearest branch.</p>

            <section id="permissionPanel">
                <p>location</p>
                <button type="button" id="locateButton" class="btn-large">
                    find Nearest Branch
                </button>
                <a
                    type="button"
                    href="https://www.lmgt.com/?q=what+is+a+branch"
                >
                    What is a branch?
                </a>
            </section>

            <section class="hidden" id="loadingPanel" aria-live="polite">
                <div class="loading-indicator" aria-hidden="true"></div>
                <p id="loadingMessage">Finding nearest branch.</p>
            </section>

            <section class="hidden" id="resultPanel">
                <h2>Nearest Branch</h2>
                <p id="coords"></p>
                <div id="map"></div>
            </section>

            <section class="hidden" id="errorPanel">
                <h2>Location Error</h2>
                <p id="errorCopy">
                    Southbag could not identify your nearest branch.
                </p>
                <button type="button" id="retryButton" class="btn-large">
                    Try Again
                </button>
            </section>
        </main>

        <footer>
            <a href="/"><button class="btn-large">Find a Branch</button></a>
            <a href="/"><button class="btn-small">Locate Store</button></a>
            <a href="/"><button class="btn-large">Branch Locations</button></a>
            <a href="https://servicetable.ingo.au"
                ><button class="btn-small">Get Help Now</button></a
            >
        </footer>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="script.js"></script>
    </body>
</html>
